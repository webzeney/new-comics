{% block prelude %}{% endblock %}<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description }}">
{% if page.get('noindex') %}<meta name="robots" content="noindex">{% endif %}
{% if page.canonical %}<link rel="canonical" href="{{ page.canonical }}">{% endif %}
{% if page.get('feed') %}<link rel="alternate" type="application/rss+xml" title="{{ page.feed.title }}" href="{{ page.feed.url }}">{% endif %}

<meta property="og:type" content="{{ 'website' if page.is_top else 'article' }}">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:site_name" content="漫画新刊JP">
{% if page.canonical %}<meta property="og:url" content="{{ page.canonical }}">{% endif %}

<?php @readfile(__DIR__ . '/{{ root }}assets/partials/{{ inc.head }}'); ?>
</head>
<body>
<div class="page">
<div class="page__inner">
<?php @readfile(__DIR__ . '/{{ root }}assets/partials/{{ inc.sidemenu }}'); ?>
<main class="page__main">
{% block content %}{% endblock %}
<?php @readfile(__DIR__ . '/{{ root }}assets/partials/{{ inc.footer }}'); ?>
</main>
</div>
</div>
{% block scripts %}{% endblock %}
</body>
</html>
