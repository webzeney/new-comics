name: 楽天で本を調べる（特集記事用・手動）

on:
  workflow_dispatch:
    inputs:
      query:
        description: "ISBN（カンマ区切り）か書名（| 区切り）"
        required: true
      kobo:
        description: "楽天Kobo（電子書籍）で調べる"
        type: boolean
        default: false
      sort:
        description: "並び順（-releaseDate は新しい順、+releaseDate は古い順）"
        required: false
        default: "-releaseDate"

permissions:
  contents: read

concurrency:
  group: rakuten-lookup
  cancel-in-progress: false

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: 調べる
        env:
          PYTHONPATH: src
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          QUERY: ${{ inputs.query }}
          KOBO: ${{ inputs.kobo }}
          SORT: ${{ inputs.sort }}
        run: python -m newcomics.rakutenlookup "$QUERY" --sort "$SORT" $( [ "$KOBO" = "true" ] && echo --kobo )
