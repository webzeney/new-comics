name: 楽天Koboの照らし合わせを試す（一時的）

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "試す冊数"
        required: false
        default: "40"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      DATA_REPO: ${{ github.repository_owner }}/new-comics-data
      DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: データベースの取り出し（非公開リポジトリ）
        run: git clone --quiet --depth 1 "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git" data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q requests
      - name: 試す
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          LIMIT: ${{ inputs.limit }}
        run: |
          python3 - <<'PY'
          import os, re, sqlite3, time, unicodedata, requests
          EP = "https://openapi.rakuten.co.jp/services/api/Kobo/EbookSearch/20170426"
          H = {"Origin": "https://new-comics.jp", "Referer": "https://new-comics.jp/"}
          base = {"applicationId": os.environ["RAKUTEN_APP_ID"], "accessKey": os.environ["RAKUTEN_ACCESS_KEY"], "format": "json", "formatVersion": 2, "hits": 30}
          def key(t):
              t = unicodedata.normalize("NFKC", t or "").lower()
              return "".join(c for c in t if unicodedata.category(c)[0] in "LN")
          conn = sqlite3.connect("data/newcomics.sqlite"); conn.row_factory = sqlite3.Row
          rows = conn.execute("""SELECT b.title, b.volume, b.edition, s.name AS series FROM books b LEFT JOIN series s ON s.id = b.series_id
            WHERE b.has_ebook = 1 AND b.volume IS NOT NULL ORDER BY random() LIMIT ?""", (int(os.environ.get("LIMIT") or 40),)).fetchall()
          res = {"一致": 0, "候補あり・巻が合わない": 0, "見つからない": 0, "エラー": 0}
          samples = []
          for r in rows:
              name = r["series"] or re.sub(r"\s*\d+$", "", unicodedata.normalize("NFKC", r["title"]))
              try:
                  x = requests.get(EP, params={**base, "title": name}, headers=H, timeout=30)
                  items = x.json().get("Items") or [] if x.status_code == 200 else None
              except Exception:
                  items = None
              time.sleep(1.2)
              if items is None:
                  res["エラー"] += 1
                  if res["エラー"] <= 2: print("エラー", x.status_code, x.text[:200])
                  continue
              items = [i.get("Item", i) for i in items]
              hit = None
              for it in items:
                  t = key(it.get("title"))
                  if key(name) in t and re.search(rf"(?<!\d){r['volume']}(?!\d)", unicodedata.normalize("NFKC", it.get("title") or "")):
                      hit = it; break
              if hit:
                  res["一致"] += 1
                  if len(samples) < 12: samples.append(f"{r['title']} → {hit.get('title')}")
              elif items:
                  res["候補あり・巻が合わない"] += 1
              else:
                  res["見つからない"] += 1
          print("結果:", res, "（試した冊数", len(rows), "）")
          print("一致した例:")
          for s in samples: print(" ", s)
          PY
