name: Amazon の商品ページの確認（全件・手動）

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 使う時間の上限（分）
        required: false
        default: "100"
      recheck:
        description: 見つからなかった本を、日数にかかわらず探し直す
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEWCOMICS_DB: ${{ github.workspace }}/data/newcomics.sqlite
      DATA_REPO: ${{ github.repository_owner }}/new-comics-data
      DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: データベースの取り出し（非公開リポジトリ）
        run: git clone --quiet "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git" data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: ISBN-10 の商品ページの確認
        env:
          PYTHONPATH: src
          AMAZON_CREATORS_ID: ${{ secrets.AMAZON_CREATORS_ID }}
          AMAZON_CREATORS_SECRET: ${{ secrets.AMAZON_CREATORS_SECRET }}
          AMAZON_TAG: ${{ vars.AMAZON_TAG }}
        run: python -m newcomics.amazonlink --isbn-only --max-isbn 100000 --minutes "${{ inputs.minutes }}" ${{ inputs.recheck && '--recheck' || '' }}
      - name: データベースを保存（非公開リポジトリ）
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B main
          git add newcomics.sqlite
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -q -m "data: Amazon の商品ページの確認 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git fetch -q origin main
            git rebase -q origin/main
            git push -q -u origin main
          fi
