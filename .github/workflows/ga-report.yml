name: 先月のアクセスのレポート（毎月1日）

on:
  schedule:
    - cron: "17 0 1 * *"  # 日本時間 毎月1日 9:17
  workflow_dispatch:
    inputs:
      mode:
        description: report＝先月のレポートを Issue にする／setup＝GA4 に項目を登録する（最初に1回）
        required: true
        default: report
        type: choice
        options:
          - report
          - setup
      month:
        description: レポートの月（YYYY-MM。空なら先月）
        required: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
      GA4_SA_KEY: ${{ secrets.GA4_SA_KEY }}
      DATA_REPO: ${{ github.repository_owner }}/new-comics-data
      DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests google-auth google-analytics-data google-analytics-admin
      - name: GA4 に項目を登録
        if: inputs.mode == 'setup'
        run: python tools/ga_report.py --setup
      - name: レポートを Issue にする
        if: inputs.mode != 'setup'
        env:
          MONTH: ${{ inputs.month }}
        run: python tools/ga_report.py ${MONTH:+--month "$MONTH"}
