name: 先月のアクセスのレポート（毎月1日）

on:
  schedule:
    - cron: "17 0 1 * *"  # 日本時間 毎月1日 9:17
  workflow_dispatch:
    inputs:
      mode:
        description: report＝先月のレポートを非公開リポジトリの reports に保存する／setup＝GA4 に項目を登録する（最初に1回）
        required: true
        default: report
        type: choice
        options:
          - report
          - setup
      month:
        description: レポートの月（YYYY-MM。空なら先月）
        required: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 毎晩の読み込み（fetch.yml）と同じ認証情報を使う
      GA_PROPERTY_ID: ${{ vars.GA_PROPERTY_ID }}
      GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
      DATA_REPO: ${{ github.repository_owner }}/new-comics-data
      DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests google-auth google-analytics-data google-analytics-admin
      - name: GA4 に項目を登録
        if: inputs.mode == 'setup'
        run: python tools/ga_report.py --setup
      - name: レポートを非公開リポジトリに保存する
        if: inputs.mode != 'setup'
        env:
          MONTH: ${{ inputs.month }}
        run: |
          git clone --quiet --depth 1 "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git" data
          python tools/ga_report.py ${MONTH:+--month "$MONTH"} --out-dir data/reports
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then echo "変わったところはありません"; exit 0; fi
          git commit --quiet -m "アクセスのレポートを保存"
          git push --quiet
