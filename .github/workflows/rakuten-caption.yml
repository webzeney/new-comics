name: 楽天の書影・紹介文の補完（全件・手動）

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 使う時間の上限（分）
        required: false
        default: "100"

permissions:
  contents: read

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  caption:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEWCOMICS_DB: ${{ github.workspace }}/data/newcomics.sqlite
      DATA_REPO: ${{ github.repository_owner }}/new-comics-data
      DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: データベースの取り出し（非公開リポジトリ）
        run: git clone --quiet "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git" data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: 楽天の書影・紹介文の補完
        env:
          PYTHONPATH: src
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ vars.RAKUTEN_AFFILIATE_ID }}
          MINUTES: ${{ inputs.minutes }}
        run: python -m newcomics.rakutencover --max-captions 100000 --minutes "$MINUTES"
      - name: データベースを保存（非公開リポジトリ）
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B main
          git add newcomics.sqlite
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -q -m "data: 楽天の紹介文の補完 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git fetch -q origin main
            git rebase -q origin/main
            git push -q -u origin main
          fi
