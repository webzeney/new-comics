name: サイトの転送

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check＝転送先の確認だけ／deploy＝確認のあと転送"
        required: true
        default: check
        type: choice
        options:
          - check
          - deploy
  workflow_run:
    workflows: ["出版社サイトの取得"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'schedule' &&
       vars.AUTO_DEPLOY == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      MODE: ${{ inputs.mode || 'deploy' }}
      PYTHONPATH: src
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_DIR: ${{ secrets.FTP_DIR }}
      NEWCOMICS_DB: ${{ github.workspace }}/data/newcomics.sqlite
      DATA_REPO: ${{ github.repository_owner }}/new-comics-data
      DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: データベースの取り出し（非公開リポジトリ）
        if: env.MODE == 'deploy'
        run: |
          git clone --quiet --depth 1 "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git" data
          test -f data/newcomics.sqlite
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: 転送先の確認
        run: python -m newcomics.ftpcheck
      - name: ページ生成
        if: env.MODE == 'deploy'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GA4_ID: ${{ vars.GA4_ID }}
          AMAZON_TAG: ${{ vars.AMAZON_TAG }}
          PRIVACY_DATE: ${{ vars.PRIVACY_DATE }}
        run: python -m newcomics.build --out dist
      - name: 転送
        if: env.MODE == 'deploy'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            feature/**
            data/**
