name: サイトの転送

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check＝転送先の確認だけ／deploy＝確認のあと転送"
        required: true
        default: check
        type: choice
        options:
          - check
          - deploy
      nightly_day:
        description: "夜の転送の続き（自動で使う。手動では空のまま）"
        required: false
        default: ""
        type: string
  workflow_run:
    workflows: ["出版社サイトの取得"]
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  # 転送しない実行（push で起きた取得のあとなど）が順番待ちに入り、手動の転送を取り消さないようにする
  # 夜の転送（0:00 まで待つ）は別の組にして、待っている間も手動の転送ができるようにする
  group: ${{ (github.event_name == 'workflow_dispatch' && inputs.nightly_day == '') && 'deploy' || (github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'schedule') && 'deploy-nightly' || format('skip-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # 一部の出版社の取得に失敗しても（取得は失敗として残る）、保存できたデータで転送する
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') &&
       github.event.workflow_run.event == 'schedule' &&
       vars.AUTO_DEPLOY == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MODE: ${{ inputs.mode || 'deploy' }}
      PYTHONPATH: src
      NEWCOMICS_DB: ${{ github.workspace }}/data/newcomics.sqlite
      DATA_REPO: ${{ github.repository_owner }}/new-comics-data
      DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
    steps:
      # 予約の取得のうち、取得済みのため何もしなかった実行のあとは転送しない
      - name: 取得したかの確認
        id: fetched
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          c=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" --jq '[.jobs[] | select(.name == "fetch") | .conclusion] | first // ""')
          if [ "$c" = success ] || [ "$c" = failure ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "取得をしていない実行のため転送しません"
          fi
      # 取得の実行が失敗したときは、失敗したのが出版社の取得（と補完）だけのとき（データは保存済み）に限って転送する。
      # テスト・データベースの保存・ページ生成の確認が失敗したときは転送しない
      - name: 取得の結果の確認
        if: github.event_name == 'workflow_run' && steps.fetched.outputs.run == '1' && github.event.workflow_run.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          ok='["取得","取得の失敗を通知","Amazon の照らし合わせ（商品ページの確認・書影・Kindle版・ISBN の分からない本。楽天の書影を探す前に行う）","楽天の書影・紹介文の補完（書影・紹介文のない本）","楽天Kobo の照らし合わせ（電子版ありの本）","アナリティクスの読み込み（よく見られている新刊）"]'
          other=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" --jq "[.jobs[].steps[] | select(.conclusion == \"failure\") | .name] - $ok | join(\",\")")
          if [ -n "$other" ]; then
            echo "出版社の取得以外の手順が失敗したため転送しません：$other"
            exit 1
          fi
          echo "失敗したのは出版社の取得だけなので、保存できたデータで転送します"
      # 夜の転送は日本時間 0:00 にサイトを切り替える。GitHub の予約実行は7時間以上遅れることがあるため、取得はお昼すぎから起動し、
      # 転送は 23:40 まで待つ。1回の実行で待てるのは6時間までなので、5時間を超えて待つときは5時間待ってから続きの実行を起動する。
      # 23:40 に最新のコードとデータを取り出し、Amazon の書影（取得から24時間以内のものだけを使う）と売れ筋順位を取り直してから、
      # 0:00 にページを作って転送する。転送のあと、X の投稿（6:00 まで待つ）を起動する
      - name: 夜の転送の日
        id: night
        run: |
          if [ "${{ github.event_name }}" = workflow_run ] && [ "${{ steps.fetched.outputs.run }}" = 1 ]; then
            if [ "$(TZ=Asia/Tokyo date +%H)" -ge 12 ]; then day=$(TZ=Asia/Tokyo date -d tomorrow +%F); else day=$(TZ=Asia/Tokyo date +%F); fi
          elif [ "${{ github.event_name }}" = workflow_dispatch ] && [ -n "${{ inputs.nightly_day }}" ]; then
            day="${{ inputs.nightly_day }}"
          else
            exit 0
          fi
          echo "$day 0:00 の転送"
          echo "day=$day" >> "$GITHUB_OUTPUT"
      - name: 23:40 まで待つ
        id: wait
        if: steps.night.outputs.day != ''
        env:
          DAY: ${{ steps.night.outputs.day }}
        run: |
          target=$(( $(TZ=Asia/Tokyo date -d "$DAY 00:00" +%s) - 1200 ))
          left=$(( target - $(date +%s) ))
          if [ "$left" -gt 18000 ]; then
            echo "$(( left / 60 )) 分あるため、5時間待ってから続きの実行を起動します"
            sleep 18000
            echo "hop=1" >> "$GITHUB_OUTPUT"
          elif [ "$left" -gt 0 ]; then
            echo "$(( left / 60 )) 分待ちます"
            sleep "$left"
          fi
      - name: 続きの実行を起動
        if: steps.wait.outputs.hop == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          DAY: ${{ steps.night.outputs.day }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main -f mode=deploy -f nightly_day="$DAY"
      - name: 転送するかどうか
        id: go
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] && [ -z "${{ inputs.nightly_day }}" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ steps.night.outputs.day }}" ] && [ "${{ steps.wait.outputs.hop }}" != 1 ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.go.outputs.run == '1'
        with:
          ref: main
      - name: データベースの取り出し（非公開リポジトリ）
        if: steps.go.outputs.run == '1' && env.MODE == 'deploy'
        run: |
          git clone --quiet --depth 1 "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git" data
          test -f data/newcomics.sqlite
      - uses: actions/setup-python@v5
        if: steps.go.outputs.run == '1'
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
        if: steps.go.outputs.run == '1'
      - name: 転送先の確認
        if: steps.go.outputs.run == '1'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: python -m newcomics.ftpcheck
      - name: Amazon の書影と売れ筋順位の取り直し
        if: steps.night.outputs.day != '' && steps.go.outputs.run == '1'
        continue-on-error: true
        timeout-minutes: 18
        env:
          AMAZON_CREATORS_ID: ${{ secrets.AMAZON_CREATORS_ID }}
          AMAZON_CREATORS_SECRET: ${{ secrets.AMAZON_CREATORS_SECRET }}
          AMAZON_TAG: ${{ vars.AMAZON_TAG }}
        run: python -m newcomics.amazonlink --images-only --minutes 16
      - name: 0:00 まで待つ
        if: steps.night.outputs.day != '' && steps.go.outputs.run == '1'
        env:
          DAY: ${{ steps.night.outputs.day }}
        run: |
          target=$(TZ=Asia/Tokyo date -d "$DAY 00:00" +%s)
          now=$(date +%s)
          if [ "$now" -lt "$target" ]; then
            echo "$(( target - now )) 秒待ちます"
            sleep $(( target - now ))
          fi
      - name: ページ生成
        if: steps.go.outputs.run == '1' && env.MODE == 'deploy'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GA4_ID: ${{ vars.GA4_ID }}
          ADSENSE_CLIENT: ca-pub-7804029286639938
          RAKUTEN_LINK_ID: _RTLink153451
          AMAZON_TAG: ${{ vars.AMAZON_TAG }}
          # バリューコマース（セブンネットの MyLink）のサイト ID とプログラムの番号。リンクのアドレスに入る公開の番号
          VC_SID: "3787070"
          VC_SEVEN_PID: "892745070"
          PRIVACY_DATE: ${{ vars.PRIVACY_DATE }}
          FEATURE_API: ${{ vars.SITE_URL }}/feature/wp-json/wp/v2/posts
          DAY: ${{ steps.night.outputs.day }}
        run: python -m newcomics.build --out dist ${DAY:+--today "$DAY"}
      - name: お問い合わせの通知先を設定
        if: steps.go.outputs.run == '1' && env.MODE == 'deploy'
        env:
          CONTACT_TO: ${{ secrets.CONTACT_TO }}
        run: |
          python - <<'PY'
          import json, os
          to = os.environ.get("CONTACT_TO", "").strip()
          with open("dist/contact/config.php", "w", encoding="utf-8") as f:
              f.write("<?php\nreturn ['to' => " + json.dumps(to) + "];\n")
          print("通知先：" + ("設定あり" if to else "未設定（受信内容はサーバーに保存のみ）"))
          PY
      - name: .html を PHP として動かす設定（一番上の .htaccess の末尾に追記）
        if: steps.go.outputs.run == '1' && env.MODE == 'deploy'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: python -m newcomics.htaccess
      - name: 転送
        if: steps.go.outputs.run == '1' && env.MODE == 'deploy'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: python -m newcomics.ftpsync --local dist --remote "$FTP_DIR" --exclude 'feature/**' --exclude 'data/**' --exclude '.git*' --workers 3
      - name: 特集のテーマを転送
        if: steps.go.outputs.run == '1' && env.MODE == 'deploy'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: python -m newcomics.ftpsync --local wordpress/new-comics --remote "${FTP_DIR%/}/feature/wp-content/themes/new-comics/" --workers 2 --make-base
      - name: X の投稿を起動（6:00 まで待って投稿する）
        if: steps.night.outputs.day != '' && steps.go.outputs.run == '1' && env.MODE == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          DAY: ${{ steps.night.outputs.day }}
        run: gh workflow run x-post.yml --repo "${{ github.repository }}" --ref main -f nightly_day="$DAY"
