name: サイトの転送

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check＝転送先の確認だけ／deploy＝確認のあと転送／probe＝サーバーの動作確認用ファイルだけ転送"
        required: true
        default: check
        type: choice
        options:
          - check
          - deploy
          - probe
  workflow_run:
    workflows: ["出版社サイトの取得"]
    types: [completed]

permissions:
  contents: read

concurrency:
  # 転送しない実行（push で起きた取得のあとなど）が順番待ちに入り、手動の転送を取り消さないようにする
  group: ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'schedule') && 'deploy' || format('skip-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'schedule' &&
       vars.AUTO_DEPLOY == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      MODE: ${{ inputs.mode || 'deploy' }}
      PYTHONPATH: src
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_DIR: ${{ secrets.FTP_DIR }}
      NEWCOMICS_DB: ${{ github.workspace }}/data/newcomics.sqlite
      DATA_REPO: ${{ github.repository_owner }}/new-comics-data
      DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: データベースの取り出し（非公開リポジトリ）
        if: env.MODE == 'deploy'
        run: |
          git clone --quiet --depth 1 "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git" data
          test -f data/newcomics.sqlite
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: 転送先の確認
        run: python -m newcomics.ftpcheck
      - name: ページ生成
        if: env.MODE == 'deploy'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GA4_ID: ${{ vars.GA4_ID }}
          AMAZON_TAG: ${{ vars.AMAZON_TAG }}
          PRIVACY_DATE: ${{ vars.PRIVACY_DATE }}
          FEATURE_API: ${{ vars.SITE_URL }}/feature/wp-json/wp/v2/posts
        run: python -m newcomics.build --out dist
      - name: お問い合わせの通知先を設定
        if: env.MODE == 'deploy'
        env:
          CONTACT_TO: ${{ secrets.CONTACT_TO }}
        run: |
          python - <<'PY'
          import json, os
          to = os.environ.get("CONTACT_TO", "").strip()
          with open("dist/contact/config.php", "w", encoding="utf-8") as f:
              f.write("<?php\nreturn ['to' => " + json.dumps(to) + "];\n")
          print("通知先：" + ("設定あり" if to else "未設定（受信内容はサーバーに保存のみ）"))
          PY
      - name: 転送
        if: env.MODE == 'deploy'
        run: python -m newcomics.ftpsync --local dist --remote "$FTP_DIR" --exclude 'feature/**' --exclude 'data/**' --exclude '.git*' --workers 3
      - name: 特集のテーマを転送
        if: env.MODE == 'deploy'
        run: python -m newcomics.ftpsync --local wordpress/new-comics --remote "${FTP_DIR%/}/feature/wp-content/themes/new-comics/" --workers 2 --make-base
      - name: ルートの.htaccessの有無（成功＝あり・失敗＝なし）
        if: env.MODE == 'probe'
        continue-on-error: true
        run: |
          python - <<'PY'
          import ftplib, os, sys
          ftp = ftplib.FTP_TLS(os.environ["FTP_SERVER"], timeout=30)
          ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])
          ftp.prot_p()
          ftp.cwd(os.environ["FTP_DIR"])
          try:
              ftp.size(".htaccess")
              ok = True
          except ftplib.error_perm:
              ok = False
          ftp.quit()
          sys.exit(0 if ok else 1)
          PY
      - name: PHPの動作確認用ファイルを転送
        if: env.MODE == 'probe'
        run: |
          php='<?php echo "PHP-OK"; ?>'
          for d in a b c d; do mkdir -p probe/$d; printf '%s\n' "$php" > probe/$d/t.html; done
          printf '%s\n' "$php" > probe/d/t.php
          printf '<FilesMatch "\\.html$">\nAddHandler php-script .php .html\n</FilesMatch>\n' > probe/a/.htaccess
          printf 'AddHandler php-script .html\n' > probe/b/.htaccess
          printf 'AddType application/x-httpd-php .php .html\nAddHandler application/x-httpd-php .php .html\n' > probe/c/.htaccess
          python -m newcomics.ftpsync --local probe --remote "${FTP_DIR%/}/_probe/" --workers 1 --make-base
