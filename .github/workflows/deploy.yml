name: サイトの転送

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check＝転送先の確認だけ／deploy＝確認のあと転送"
        required: true
        default: check
        type: choice
        options:
          - check
          - deploy
  workflow_run:
    workflows: ["出版社サイトの取得"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  # 転送しない実行（push で起きた取得のあとなど）が順番待ちに入り、手動の転送を取り消さないようにする
  group: ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'schedule') && 'deploy' || format('skip-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # 一部の出版社の取得に失敗しても（取得は失敗として残る）、保存できたデータで転送する
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') &&
       github.event.workflow_run.event == 'schedule' &&
       vars.AUTO_DEPLOY == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      MODE: ${{ inputs.mode || 'deploy' }}
      PYTHONPATH: src
      NEWCOMICS_DB: ${{ github.workspace }}/data/newcomics.sqlite
      DATA_REPO: ${{ github.repository_owner }}/new-comics-data
      DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
    steps:
      # 取得の実行が失敗したときは、失敗したのが出版社の取得（と補完）だけのとき（データは保存済み）に限って転送する。
      # テスト・データベースの保存・ページ生成の確認が失敗したときは転送しない
      - name: 取得の結果の確認
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          ok='["取得","取得の失敗を通知","Amazon の照らし合わせ（商品ページの確認・書影・Kindle版・ISBN の分からない本。楽天の書影を探す前に行う）","楽天の書影の補完（書影のない本）","楽天Kobo の照らし合わせ（電子版ありの本）","アナリティクスの読み込み（よく見られている新刊）"]'
          other=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" --jq "[.jobs[].steps[] | select(.conclusion == \"failure\") | .name] - $ok | join(\",\")")
          if [ -n "$other" ]; then
            echo "出版社の取得以外の手順が失敗したため転送しません：$other"
            exit 1
          fi
          echo "失敗したのは出版社の取得だけなので、保存できたデータで転送します"
      - uses: actions/checkout@v4
      - name: データベースの取り出し（非公開リポジトリ）
        if: env.MODE == 'deploy'
        run: |
          git clone --quiet --depth 1 "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git" data
          test -f data/newcomics.sqlite
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: 転送先の確認
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: python -m newcomics.ftpcheck
      - name: ページ生成
        if: env.MODE == 'deploy'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GA4_ID: ${{ vars.GA4_ID }}
          ADSENSE_CLIENT: ca-pub-7804029286639938
          RAKUTEN_LINK_ID: _RTLink153451
          AMAZON_TAG: ${{ vars.AMAZON_TAG }}
          PRIVACY_DATE: ${{ vars.PRIVACY_DATE }}
          FEATURE_API: ${{ vars.SITE_URL }}/feature/wp-json/wp/v2/posts
        run: python -m newcomics.build --out dist
      - name: お問い合わせの通知先を設定
        if: env.MODE == 'deploy'
        env:
          CONTACT_TO: ${{ secrets.CONTACT_TO }}
        run: |
          python - <<'PY'
          import json, os
          to = os.environ.get("CONTACT_TO", "").strip()
          with open("dist/contact/config.php", "w", encoding="utf-8") as f:
              f.write("<?php\nreturn ['to' => " + json.dumps(to) + "];\n")
          print("通知先：" + ("設定あり" if to else "未設定（受信内容はサーバーに保存のみ）"))
          PY
      - name: .html を PHP として動かす設定（一番上の .htaccess の末尾に追記）
        if: env.MODE == 'deploy'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: python -m newcomics.htaccess
      - name: 転送
        if: env.MODE == 'deploy'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: python -m newcomics.ftpsync --local dist --remote "$FTP_DIR" --exclude 'feature/**' --exclude 'data/**' --exclude '.git*' --workers 3
      - name: 特集のテーマを転送
        if: env.MODE == 'deploy'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: python -m newcomics.ftpsync --local wordpress/new-comics --remote "${FTP_DIR%/}/feature/wp-content/themes/new-comics/" --workers 2 --make-base
