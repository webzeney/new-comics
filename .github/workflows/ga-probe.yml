name: アナリティクスの読み込みを試す（一時的）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q requests google-auth
      - name: 試す
        env:
          PYTHONPATH: src
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
          GA_PROPERTY_ID: ${{ vars.GA_PROPERTY_ID }}
        run: python -m newcomics.ga
