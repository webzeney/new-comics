name: 楽天ブックスの登録状況の調査

on:
  workflow_dispatch:
    inputs:
      publishers:
        description: "調べる出版社名（カンマ区切り）。空欄ならコミックのジャンル全体で、判型がコミック以外の本を調べる"
        required: false
        default: ""
      from:
        description: "対象期間の始まり（YYYY-MM）"
        required: true
        default: "2026-10"
      to:
        description: "対象期間の終わり（YYYY-MM）"
        required: true
        default: "2027-01"

permissions:
  contents: read

# 楽天へのリクエストが毎日の取得と重ならないよう、同じ順番待ちに入れる
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATA_REPO: ${{ github.repository_owner }}/new-comics-data
      DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: データベースの取り出し（非公開リポジトリ）
        run: git clone --quiet --depth 1 "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git" data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: 調査
        env:
          PYTHONPATH: src
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          PUBLISHERS: ${{ github.event.inputs.publishers }}
          FROM: ${{ github.event.inputs.from }}
          TO: ${{ github.event.inputs.to }}
        run: python -m newcomics.rakutenprobe $( [ -z "$PUBLISHERS" ] && echo --genre ) --publishers "$PUBLISHERS" --from "$FROM" --to "$TO" --db data/newcomics.sqlite --out probe/rakuten-probe.tsv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rakuten-probe
          path: probe/
          if-no-files-found: warn
          retention-days: 7
