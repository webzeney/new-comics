name: 秋田書店の件数を調べる（一時的）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATA_REPO: ${{ github.repository_owner }}/new-comics-data
      DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: データベースの取り出し（非公開リポジトリ）
        run: git clone --quiet --depth 1 "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git" data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -r requirements.txt
      - name: 調べる（保存はしない）
        env:
          PYTHONPATH: src
        run: |
          python3 - <<'PY'
          import sqlite3
          from collections import Counter
          from datetime import datetime
          from newcomics import db
          from newcomics.fetch import target_months
          from newcomics.http import PoliteClient
          from newcomics.fetchers import akitashoten
          conn = sqlite3.connect("data/newcomics.sqlite"); conn.row_factory = sqlite3.Row
          print("データベースの秋田書店の本（発売月ごと）:")
          for r in conn.execute("SELECT substr(b.release_date,1,7) m, COUNT(*) n FROM books b JOIN publishers p ON p.id=b.publisher_id WHERE p.slug='akitashoten' AND b.release_date >= '2026-09' GROUP BY m ORDER BY m"):
              print(" ", r["m"], r["n"])
          print("これまでの取得件数:")
          for r in conn.execute("SELECT started_at, item_count, status FROM fetch_runs WHERE source='akitashoten' ORDER BY id DESC LIMIT 8"):
              print(" ", r["started_at"], r["item_count"], r["status"])
          months = target_months(datetime.now(db.JST).date(), 3)
          known = {r["source_key"]: r for r in conn.execute("SELECT * FROM books WHERE source_key LIKE 'akitashoten:%'")}
          recs = akitashoten.fetch(PoliteClient(), conn, None, months, print, known=known)
          print("今回取れた本（発売月ごと）:", sorted(Counter((r.release_date or "未定")[:7] for r in recs).items()))
          PY
