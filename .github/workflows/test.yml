name: テスト（main に入れたとき）

# 夜の取得の前にテストの失敗に気づけるように、main に入れたときにもテストを走らせる。
# 夜の取得（fetch.yml）はテストに通らないと取得も転送もしないため、ここで先に見つけて直す（2026-11-18 運営者の判断）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: テスト
        run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src
