name: 楽天で書名を調べる（特集記事用）

on:
  workflow_dispatch:
    inputs:
      titles:
        description: "書名を | 区切りで"
        required: true
      kobo:
        description: "楽天Kobo（電子書籍）で調べる"
        type: boolean
        default: false
      sort:
        description: "並び順（-releaseDate は新しい順、+releaseDate は古い順）"
        required: false
        default: "-releaseDate"

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: 調べる
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          TITLES: ${{ inputs.titles }}
          KOBO: ${{ inputs.kobo }}
          SORT: ${{ inputs.sort }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          base = "https://openapi.rakuten.co.jp/services/api/" + ("Kobo/EbookSearch/20170426" if os.environ.get("KOBO") == "true" else "BooksBook/Search/20170404")
          for title in [t.strip() for t in os.environ["TITLES"].split("|") if t.strip()]:
              rows = []
              for page in (1, 2, 3):
                  q = urllib.parse.urlencode({"applicationId": os.environ["RAKUTEN_APP_ID"], "accessKey": os.environ["RAKUTEN_ACCESS_KEY"], "format": "json", "formatVersion": 2,
                                              "title": title, "sort": os.environ.get("SORT") or "-releaseDate", "hits": 30, "page": page} | ({} if os.environ.get("KOBO") == "true" else {"outOfStockFlag": 1}))
                  req = urllib.request.Request(f"{base}?{q}", headers={"Origin": "https://new-comics.jp", "Referer": "https://new-comics.jp/"})
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          data = json.loads(r.read())
                  except Exception as e:
                      print(title, "エラー", e); data = {}
                  time.sleep(1.2)
                  items = data.get("Items") or []
                  rows += items
                  if page >= (data.get("pageCount") or 1):
                      break
              print("=====", title, len(rows))
              for it in rows:
                  print(" ", it.get("isbn") or it.get("itemNumber"), "|", it.get("title"), "|", it.get("publisherName"), "|", it.get("seriesName"), "|", it.get("salesDate"), "|", it.get("itemPrice"), "|", it.get("largeImageUrl"), "|", it.get("itemUrl"))
          PY
