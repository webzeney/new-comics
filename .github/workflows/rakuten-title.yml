name: 楽天で書名を調べる（特集記事用）

on:
  workflow_dispatch:
    inputs:
      titles:
        description: "書名を | 区切りで"
        required: true

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: 調べる
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          TITLES: ${{ inputs.titles }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          base = "https://openapi.rakuten.co.jp/services/api/BooksBook/Search/20170404"
          for title in [t.strip() for t in os.environ["TITLES"].split("|") if t.strip()]:
              rows = []
              for page in (1, 2, 3):
                  q = urllib.parse.urlencode({"applicationId": os.environ["RAKUTEN_APP_ID"], "accessKey": os.environ["RAKUTEN_ACCESS_KEY"], "format": "json", "formatVersion": 2,
                                              "title": title, "sort": "-releaseDate", "hits": 30, "page": page, "outOfStockFlag": 1})
                  req = urllib.request.Request(f"{base}?{q}", headers={"Origin": "https://new-comics.jp", "Referer": "https://new-comics.jp/"})
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          data = json.loads(r.read())
                  except Exception as e:
                      print(title, "エラー", e); data = {}
                  time.sleep(1.2)
                  items = data.get("Items") or []
                  rows += items
                  if page >= (data.get("pageCount") or 1):
                      break
              print("=====", title, len(rows))
              for it in rows:
                  print(" ", it.get("isbn"), "|", it.get("title"), "|", it.get("publisherName"), "|", it.get("seriesName"), "|", it.get("salesDate"), "|", it.get("itemPrice"), "|", it.get("largeImageUrl"), "|", it.get("itemUrl"))
          PY
