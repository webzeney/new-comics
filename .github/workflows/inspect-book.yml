name: 書籍データの確認（手動）

on:
  workflow_dispatch:
    inputs:
      title:
        description: 書名の一部（重複を数えるときは「--dups」）
        required: true

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATA_REPO: ${{ github.repository_owner }}/new-comics-data
      DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
      TITLE: ${{ inputs.title }}
    steps:
      - uses: actions/checkout@v4
      - name: データベースの取り出し（非公開リポジトリ）
        run: git clone --quiet --depth 1 "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git" data
      - name: ISBN のない重複を数える
        if: inputs.title == '--dups'
        env:
          PYTHONPATH: src
          NEWCOMICS_DB: data/newcomics.sqlite
        run: python -m newcomics.dedupe
      - name: レーベルの一覧
        run: |
          python3 - <<'PY2'
          import sqlite3
          c = sqlite3.connect("data/newcomics.sqlite")
          for r in c.execute("""SELECT l.id, p.name, l.name, COUNT(b.id) FROM labels l JOIN publishers p ON p.id=l.publisher_id LEFT JOIN books b ON b.label_id=l.id
                                WHERE l.is_adult=0 AND p.is_adult=0 GROUP BY l.id ORDER BY p.name, l.name"""):
              print("LBL", *r, sep="\t")
          PY2
