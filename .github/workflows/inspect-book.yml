name: 書籍データの確認（手動）

on:
  workflow_dispatch:
    inputs:
      title:
        description: 書名の一部（重複を数えるときは「--dups」）
        required: true

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATA_REPO: ${{ github.repository_owner }}/new-comics-data
      DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
      TITLE: ${{ inputs.title }}
    steps:
      - uses: actions/checkout@v4
      - name: データベースの取り出し（非公開リポジトリ）
        run: git clone --quiet --depth 1 "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git" data
      - name: ISBN のない重複を数える
        if: inputs.title == '--dups'
        env:
          PYTHONPATH: src
          NEWCOMICS_DB: data/newcomics.sqlite
        run: python -m newcomics.dedupe
      - name: 調査
        run: |
          python3 - <<'PY'
          import sqlite3, collections
          c = sqlite3.connect("data/newcomics.sqlite"); c.row_factory = sqlite3.Row
          q = lambda sql, *a: [dict(r) for r in c.execute(sql, a)]
          print(q("SELECT MIN(release_date) mn, MAX(release_date) mx, COUNT(*) n FROM books"))
          print("月ごとの件数", q("SELECT substr(release_date,1,7) m, COUNT(*) n FROM books GROUP BY 1 ORDER BY 1"))
          pubs = q("""SELECT p.name, COUNT(*) n FROM books b JOIN publishers p ON p.id=b.publisher_id
                     WHERE b.release_date BETWEEN '2026-01-01' AND '2027-01-31' AND p.is_adult=0 GROUP BY 1 ORDER BY n DESC LIMIT 25""")
          for pr in pubs:
              rows = q("""SELECT b.release_date d FROM books b JOIN publishers p ON p.id=b.publisher_id
                          WHERE p.name=? AND b.release_date BETWEEN '2026-01-01' AND '2027-01-31'""", pr["name"])
              days = collections.Counter(int(r["d"][8:10]) for r in rows)
              months = collections.Counter(r["d"][:7] for r in rows)
              dates = collections.Counter(r["d"] for r in rows)
              print("PUB", pr["name"], pr["n"], "月数", len(months), "日別上位", days.most_common(8), "発売日数", len(dates), "多い日", dates.most_common(6))
          print("曜日別（全体）", collections.Counter(__import__('datetime').date.fromisoformat(r["d"]).weekday() for r in q("SELECT release_date d FROM books WHERE release_date BETWEEN '2026-01-01' AND '2027-01-31'")))
          print("長期連載")
          for r in q("""SELECT s.id, s.name, MAX(b.volume) v, COUNT(*) n, p.name pub,
                        (SELECT price FROM books x WHERE x.series_id=s.id AND x.volume=(SELECT MAX(volume) FROM books y WHERE y.series_id=s.id) LIMIT 1) price,
                        MAX(b.release_date) last, MIN(b.release_date) first
                        FROM books b JOIN series s ON s.id=b.series_id JOIN publishers p ON p.id=b.publisher_id
                        WHERE b.volume IS NOT NULL GROUP BY s.id ORDER BY v DESC LIMIT 45"""): print(r)
          PY
