name: 書籍データの確認（手動）

on:
  workflow_dispatch:
    inputs:
      title:
        description: 書名の一部（重複を数えるときは「--dups」）
        required: true

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATA_REPO: ${{ github.repository_owner }}/new-comics-data
      DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
      TITLE: ${{ inputs.title }}
    steps:
      - uses: actions/checkout@v4
      - name: データベースの取り出し（非公開リポジトリ）
        run: git clone --quiet --depth 1 "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git" data
      - name: ISBN のない重複を数える
        if: inputs.title == '--dups'
        env:
          PYTHONPATH: src
          NEWCOMICS_DB: data/newcomics.sqlite
        run: python -m newcomics.dedupe
      - name: 調査
        run: |
          python3 - <<'PY'
          import sqlite3
          c = sqlite3.connect("data/newcomics.sqlite"); c.row_factory = sqlite3.Row
          q = lambda sql: [dict(r) for r in c.execute(sql)]
          print(q("SELECT b.*, l.name AS label FROM books b LEFT JOIN labels l ON l.id=b.label_id WHERE b.id=3727"))
          print("ISBN なし・2026-10-01 以降・出版社別・レーベル別（書影なし／全体）")
          for r in q("""SELECT p.name pub, COALESCE(l.name,'-') label, SUM(b.image_url IS NULL) noimg, COUNT(*) n, SUM(b.kindle_asin IS NOT NULL) kindle, SUM(b.kobo_url IS NOT NULL) kobo, SUM(b.asin IS NOT NULL) asin
              FROM books b JOIN publishers p ON p.id=b.publisher_id LEFT JOIN labels l ON l.id=b.label_id
              WHERE COALESCE(b.isbn13,'')='' AND b.release_date >= '2026-10-01' GROUP BY 1,2 ORDER BY n DESC LIMIT 40"""): print(r)
          print("書影なしの例")
          for r in q("""SELECT b.id,p.name pub,COALESCE(l.name,'-') label,b.title,b.release_date,b.has_ebook,b.kindle_checked_at FROM books b JOIN publishers p ON p.id=b.publisher_id LEFT JOIN labels l ON l.id=b.label_id
              WHERE COALESCE(b.isbn13,'')='' AND b.image_url IS NULL AND b.release_date >= '2026-10-01' ORDER BY b.release_date LIMIT 40"""): print(r)
          PY
