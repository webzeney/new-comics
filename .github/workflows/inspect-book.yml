name: 書籍データの確認（手動）

on:
  workflow_dispatch:
    inputs:
      title:
        description: 書名の一部（重複を数えるときは「--dups」）
        required: true

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATA_REPO: ${{ github.repository_owner }}/new-comics-data
      DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
      TITLE: ${{ inputs.title }}
    steps:
      - uses: actions/checkout@v4
      - name: データベースの取り出し（非公開リポジトリ）
        run: git clone --quiet --depth 1 "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git" data
      - name: ISBN のない重複を数える
        if: inputs.title == '--dups'
        env:
          PYTHONPATH: src
          NEWCOMICS_DB: data/newcomics.sqlite
        run: python -m newcomics.dedupe
      - name: 作品の一覧
        run: |
          python3 - <<'PY2'
          import sqlite3
          c = sqlite3.connect("data/newcomics.sqlite")
          for r in c.execute("""SELECT s.id, s.name, COUNT(b.id), MAX(b.volume) FROM series s JOIN books b ON b.series_id=s.id JOIN publishers p ON p.id=b.publisher_id
                                LEFT JOIN labels l ON l.id=b.label_id WHERE p.is_adult=0 AND COALESCE(l.is_adult,0)=0 GROUP BY s.id"""):
              print("SER", *r, sep="\t")
          PY2
