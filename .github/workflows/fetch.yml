name: 出版社サイトの取得

on:
  schedule:
    # サイトは日本時間 0:00 に切り替える。GitHub の予約実行は7時間以上遅れることがあるため、お昼すぎから何回か起動し、
    # 先に動き出した実行が取得する（あとの実行は、その日の分を取得済みなら何もしない）。転送は deploy.yml が 0:00 まで待って行う
    - cron: "40 3 * * *"   # 日本時間 12:40
    - cron: "40 5 * * *"   # 日本時間 14:40
    - cron: "40 7 * * *"   # 日本時間 16:40
    - cron: "40 9 * * *"   # 日本時間 18:40
    - cron: "40 11 * * *"  # 日本時間 20:40
    - cron: "40 13 * * *"  # 日本時間 22:40
    - cron: "5 15 * * *"   # 日本時間 0:05（予備）
  workflow_dispatch:
    inputs:
      publisher:
        description: "対象の出版社（空欄ですべて。例: shonengahosha）"
        required: false
        default: ""
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  # 予約実行のときは、切り替える日（日本時間の正午より後なら翌日）の分を取得済みかを確かめる
  gate:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[fetch]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.go.outputs.run }}
      day: ${{ steps.day.outputs.day }}
    steps:
      - name: 切り替える日
        id: day
        run: |
          if [ "$(TZ=Asia/Tokyo date +%H)" -ge 12 ]; then
            echo "day=$(TZ=Asia/Tokyo date -d tomorrow +%F)" >> "$GITHUB_OUTPUT"
          else
            echo "day=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"
          fi
      - name: 取得済みかの確認
        id: done
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .fetched
          key: fetched-${{ steps.day.outputs.day }}
          lookup-only: true
      - name: 取得するかどうか
        id: go
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            if [ "${{ steps.done.outputs.cache-hit }}" = true ]; then
              echo "${{ steps.day.outputs.day }} の分は取得済みのため、ここで終わります"
              exit 0
            fi
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/fetch.yml/runs?status=in_progress&event=schedule" \
              --jq "[.workflow_runs[] | select(.id < ${{ github.run_id }})] | length")
            if [ "$n" -gt 0 ]; then
              echo "先に動いている取得があるため、ここで終わります"
              exit 0
            fi
          fi
          echo "run=1" >> "$GITHUB_OUTPUT"

  fetch:
    needs: gate
    if: needs.gate.outputs.run == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEWCOMICS_DB: ${{ github.workspace }}/data/newcomics.sqlite
      DATA_REPO: ${{ github.repository_owner }}/new-comics-data
      DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: データベースの取り出し（非公開リポジトリ）
        run: |
          git clone --quiet "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git" data
          test -f data/newcomics.sqlite
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: 単体テスト
        run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src
      - name: 取得
        id: fetch
        continue-on-error: true
        env:
          PYTHONPATH: src
          PUBLISHER: ${{ github.event.inputs.publisher }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ vars.RAKUTEN_AFFILIATE_ID }}
        run: |
          if [ -n "$PUBLISHER" ]; then
            python -m newcomics.fetch --publisher "$PUBLISHER"
          else
            python -m newcomics.fetch
          fi
      - name: Amazon の照らし合わせ（商品ページの確認・書影・Kindle版・ISBN の分からない本。楽天の書影を探す前に行う）
        id: amazon
        continue-on-error: true
        timeout-minutes: 35
        env:
          PYTHONPATH: src
          AMAZON_CREATORS_ID: ${{ secrets.AMAZON_CREATORS_ID }}
          AMAZON_CREATORS_SECRET: ${{ secrets.AMAZON_CREATORS_SECRET }}
          AMAZON_TAG: ${{ vars.AMAZON_TAG }}
        run: python -m newcomics.amazonlink
      - name: 楽天の書影・紹介文の補完（書影・紹介文のない本）
        id: rakutencover
        continue-on-error: true
        timeout-minutes: 30
        env:
          PYTHONPATH: src
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ vars.RAKUTEN_AFFILIATE_ID }}
        run: python -m newcomics.rakutencover
      - name: 楽天Kobo の照らし合わせ（電子版ありの本）
        id: kobo
        continue-on-error: true
        timeout-minutes: 15
        env:
          PYTHONPATH: src
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ vars.RAKUTEN_AFFILIATE_ID }}
        run: python -m newcomics.kobo
      - name: アナリティクスの読み込み（よく見られている新刊）
        id: ga
        continue-on-error: true
        timeout-minutes: 5
        env:
          PYTHONPATH: src
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
          GA_PROPERTY_ID: ${{ vars.GA_PROPERTY_ID }}
        run: python -m newcomics.ga
      - name: 件数の集計
        env:
          PYTHONPATH: src
        run: |
          FROM=$(TZ=Asia/Tokyo date +%Y-%m-01)
          TO=$(TZ=Asia/Tokyo date -d "$FROM +2 month -1 day" +%Y-%m-%d)
          python -m newcomics.stats --from "$FROM" --to "$TO"
      - name: データベースを保存（非公開リポジトリ）
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B main
          git add newcomics.sqlite
          # 楽天の一覧（rakuten-review.tsv）は運営者が判定を書き込む。取得の途中で書き換えられていたら、
          # 運営者の書いた内容を残し、今回の一覧は保存しない（判定は次の取得で読み込む）
          git fetch -q origin main
          if [ -f rakuten-review.tsv ]; then
            if git diff --quiet HEAD origin/main -- rakuten-review.tsv; then
              git add rakuten-review.tsv
            else
              echo "楽天の一覧が取得の途中で更新されていたため、今回は一覧を保存しません"
              git checkout -q HEAD -- rakuten-review.tsv 2>/dev/null || rm -f rakuten-review.tsv
            fi
          fi
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -q -m "data: 取得 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git rebase -q origin/main
            git push -q -u origin main
          fi
      - name: ページ生成の確認
        env:
          PYTHONPATH: src
        run: python -m newcomics.build --out dist
      - name: 取得済みの印を残す
        if: github.event_name == 'schedule'
        run: mkdir -p .fetched && date > .fetched/at
      - name: 取得済みの印を保存
        if: github.event_name == 'schedule'
        uses: actions/cache/save@v4
        with:
          path: .fetched
          key: fetched-${{ needs.gate.outputs.day }}
      - name: 補完の失敗を知らせる
        if: steps.amazon.outcome == 'failure' || steps.rakutencover.outcome == 'failure' || steps.kobo.outcome == 'failure' || steps.ga.outcome == 'failure'
        run: echo "::warning::Amazon・楽天・Kobo・アナリティクスのどれかが失敗しました（Amazon=${{ steps.amazon.outcome }} 楽天=${{ steps.rakutencover.outcome }} Kobo=${{ steps.kobo.outcome }} アナリティクス=${{ steps.ga.outcome }}）"
      - name: 取得の失敗を通知
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "取得に失敗した出版社があります。ログと fetch_runs を確認してください。"
          exit 1
