name: X にお知らせを投稿（手動）

on:
  workflow_dispatch:
    inputs:
      text:
        description: 投稿する文面（改行は \n）
        required: true
      dry_run:
        description: 確認だけ（投稿しない）
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: 投稿
        env:
          PYTHONPATH: src
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          TEXT: ${{ inputs.text }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then python -m newcomics.xpost --text "$TEXT" --dry-run; else python -m newcomics.xpost --text "$TEXT"; fi
