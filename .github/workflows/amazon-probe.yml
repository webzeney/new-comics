name: Amazon Creators API の確認

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 商品情報を1件取る
        env:
          AMAZON_CREATORS_ID: ${{ secrets.AMAZON_CREATORS_ID }}
          AMAZON_CREATORS_SECRET: ${{ secrets.AMAZON_CREATORS_SECRET }}
          AMAZON_TAG: ${{ vars.AMAZON_TAG }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          def post(url, body, headers):
              req = urllib.request.Request(url, data=json.dumps(body).encode(), headers={"Content-Type": "application/json", **headers}, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.loads(r.read() or b"{}")
              except urllib.error.HTTPError as e:
                  try:
                      return e.code, json.loads(e.read() or b"{}")
                  except Exception:
                      return e.code, {}

          cid, secret = os.environ.get("AMAZON_CREATORS_ID", ""), os.environ.get("AMAZON_CREATORS_SECRET", "")
          if not cid or not secret:
              raise SystemExit("認証情報が登録されていません")
          status, tok = post("https://api.amazon.co.jp/auth/o2/token", {"grant_type": "client_credentials", "client_id": cid, "client_secret": secret, "scope": "creatorsapi::default"}, {})
          print(f"トークンの取得：HTTP {status}")
          token = tok.get("access_token")
          if not token:
              print("エラー：", tok.get("error"), tok.get("error_description"))
              raise SystemExit(1)
          tag = os.environ.get("AMAZON_TAG") or "newcomicsjp-22"
          status, res = post("https://creatorsapi.amazon/catalog/v1/getItems", {
              "itemIds": ["4091530591"], "itemIdType": "ASIN", "marketplace": "www.amazon.co.jp", "partnerTag": tag,
              "resources": ["itemInfo.title", "images.primary.medium"],
          }, {"Authorization": f"Bearer {token}", "x-marketplace": "www.amazon.co.jp"})
          print(f"商品情報の取得：HTTP {status}")
          if status == 200:
              items = (res.get("itemsResult") or {}).get("items") or []
              print(f"取れた商品：{len(items)}件")
              for it in items:
                  print("書名：", ((it.get("itemInfo") or {}).get("title") or {}).get("displayValue"))
                  print("画像あり：", bool(((it.get("images") or {}).get("primary") or {}).get("medium")))
          else:
              for err in res.get("errors") or [res]:
                  print("エラー：", err.get("code") or err.get("type"), err.get("message"))
          PY
