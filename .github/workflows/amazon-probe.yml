name: Amazon Creators API の確認

on:
  workflow_dispatch:
    inputs:
      query:
        description: 調べる ASIN（ISBN-10）や書名・ISBN（カンマ区切り。空なら全体の確認）
        required: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: 動作確認
        env:
          PYTHONPATH: src
          AMAZON_CREATORS_ID: ${{ secrets.AMAZON_CREATORS_ID }}
          AMAZON_CREATORS_SECRET: ${{ secrets.AMAZON_CREATORS_SECRET }}
          AMAZON_TAG: ${{ vars.AMAZON_TAG }}
          QUERY: ${{ inputs.query }}
        run: python -m newcomics.amazonprobe "$QUERY"
